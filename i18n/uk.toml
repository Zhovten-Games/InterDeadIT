['agegate.sectionPrimary']
other = """
## Ласкаво просимо

InterDead — це психологічно орієнтований горор-проєкт від Zhovten Games у межах speculative fiction (SpecFi): історія про месенджера для мертвих, пам’ять і форми свідомості, що можуть бути не людськими.

Про те, як виникла ідея світу та гри, над якою ми зараз працюємо, ми докладно розповідаємо в [першому розділі циклу «Ехо незгасної пам’яті»](/about/) — це наш розширений «About».

Докладніше про структуру всесвіту, термінологію та техно-лор читайте в [InterDead Wiki на Fandom](https://interdead.fandom.com/wiki/InterDead_Wiki).

Усе, що ви побачите після цього екрана, написано «в образі» — від імені творця месенджера, соціально незграбного дослідника, який щиро намагається дотримуватися «правил маркетингу», продаючи свій інструмент, і стабільно породжує крінж.

Якщо вам потрібно вийти за межі вигадки, юридичні документи та контактна інформація доступні нижче.

- [{{ .TermsTitle }}]({{ .TermsURL }})
- [{{ .PrivacyTitle }}]({{ .PrivacyURL }})
- [{{ .AIPolicyTitle }}]({{ .AIPolicyURL }})
- [Зв’язатися через LinkedIn]({{ .LinkedInURL }})

Натискаючи «Увійти», ви підтверджуєте, що вам 18+ (або ви досягли віку повноліття у вашій юрисдикції), і приймаєте умови.
"""

