['agegate.sectionPrimary']
other = """
## ようこそ

InterDead は、Zhovten Games による speculative fiction（SpecFi）の枠組みに属する心理志向ホラープロジェクトです。死者のためのメッセンジャー、記憶、そして人間ではないかもしれない意識のあり方をめぐる物語です。

世界観と現在開発中のゲームの構想がどのように生まれたのかについては、連作「消えない記憶のエコー」の[第1章](/about/)で詳しく説明しています。これは本プロジェクトの拡張版「About」です。

ユニバースの構造や用語、テクノロアの詳細については、[Fandom 上の InterDead Wiki](https://interdead.fandom.com/ja/wiki/InterDead_Wiki) をご覧ください。

この画面より先に表示される内容はすべて「キャラクターとしての語り」で書かれています。メッセンジャーの創作者である、社会的に不器用な研究者の視点からです。彼は自分のツールを売るために「マーケティングのルール」を真剣に守ろうとしますが、その結果として確実にクリンジを生み出します。

フィクションの外に出る必要がある場合は、以下に法的文書および連絡先情報を掲載しています。

- [{{ .TermsTitle }}]({{ .TermsURL }})
- [{{ .PrivacyTitle }}]({{ .PrivacyURL }})
- [{{ .AIPolicyTitle }}]({{ .AIPolicyURL }})
- [LinkedIn で連絡]({{ .LinkedInURL }})

「入る」をクリックすると、あなたは18歳以上（またはお住まいの法域における成人年齢以上）であることを確認し、利用規約に同意したものとみなされます。
"""

