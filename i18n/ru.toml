['agegate.sectionPrimary']
other = """
## Добро пожаловать

InterDead — психологически ориентированный хоррор-проект от Zhovten Games в рамках speculative fiction (SpecFi): история о мессенджере для мёртвых, памяти и формах сознания, которые могут быть нечеловеческими.

О том, как родилась идея мира и разрабатываемой нами игры, мы подробно рассказываем в [первой главе цикла «Эхо неугасаемой памяти»](/about/) — это наш развёрнутый «About».

Подробнее о структуре вселенной, терминологии и техно-лоре читайте в [InterDead Wiki на Fandom](https://interdead.fandom.com/ru/wiki/%D0%92%D1%81%D0%B5%D0%BB%D0%B5%D0%BD%D0%BD%D0%B0%D1%8F_InterDead).

Всё, что вы увидите после этого экрана, написано «в образе» — от лица создателя мессенджера, социально неловкого исследователя, который искренне пытается следовать «правилам маркетинга», продавая свой инструмент, и надёжно производит кринж.

Если вам нужно выйти за пределы вымысла, юридические документы и контактная информация доступны ниже.

- [{{ .TermsTitle }}]({{ .TermsURL }})
- [{{ .PrivacyTitle }}]({{ .PrivacyURL }})
- [{{ .AIPolicyTitle }}]({{ .AIPolicyURL }})
- [Связаться через LinkedIn]({{ .LinkedInURL }})

Нажимая «Войти», вы подтверждаете, что вам 18+ (или вы достигли возраста совершеннолетия в вашей юрисдикции), и принимаете условия.
"""

