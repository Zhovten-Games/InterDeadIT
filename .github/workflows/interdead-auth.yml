name: Deploy interdead-auth Worker

on:
  push:
    branches:
      - main
    paths:
      - "workers/interdead-auth/**"
      - "themes/InterDead/assets/js/**"
      - ".github/scripts/build-cf-js.sh"
      - ".github/workflows/interdead-auth.yml"

jobs:
  warden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci
      - name: Install pinned Hugo
        run: |
          curl -fL --retry 2 https://github.com/gohugoio/hugo/releases/download/v0.147.9/hugo_0.147.9_linux-amd64.tar.gz -o "$RUNNER_TEMP/hugo.tar.gz"
          echo "96d367bc839b170cfc34470e41844594f4b7846a39e87850b2cb1f8c81b0d11b  $RUNNER_TEMP/hugo.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
      - run: node tools/warden.mjs

  deploy-worker:
    needs: warden
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Install dependencies (root)
        run: |
          npm ci
        working-directory: .

      - name: Build JS bundle for Cloudflare (CI-only)
        shell: bash
        run: |
          ./.github/scripts/build-cf-js.sh "${RUNNER_TEMP}/interdead-cf"

      - name: Upload Cloudflare JS bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: interdead-cf-js
          path: ${{ runner.temp }}/interdead-cf/js
          if-no-files-found: error


      - name: Deploy interdead-auth
        working-directory: ./workers/interdead-auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --no-install wrangler deploy
