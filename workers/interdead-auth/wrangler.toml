name = "interdead-auth"
main = "src/worker.js"
compatibility_date = "2024-11-28"

workers_dev = false
preview_urls = false

routes = [
  { pattern = "api.interdead.zhovten.games", zone_name = "zhovten.games", custom_domain = true }
]

[vars]
IDENTITY_DISCORD_CLIENT_ID = "1441616910436270261"
IDENTITY_DISCORD_REDIRECT_URI = "https://api.interdead.zhovten.games/auth/discord/callback"
INTERDEAD_SITE_BASE_URL = "https://interdead.zhovten.games"

[[d1_databases]]
binding = "INTERDEAD_CORE"
database_name = "interdead_core"
database_id = "6874f882-d442-4e0f-a362-3da5f30c646a"

[observability]
  [observability.logs]
    enabled = true
    head_sampling_rate = 1
    invocation_logs = true
    persist = true